<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniSkin - AI Dermatology Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- โค้ดตกแต่งสไตล์แบบฝังในไฟล์ รันได้เสร็จสรรพแม้ไม่มีเน็ต (ยกเว้นฟอนต์/ไอคอนภายนอก) -->
    <style>
        :root {
            --teal-600: #5eead4;
            --teal-500: #2dd4bf;
            --teal-100: rgba(94,234,212,0.20);
            --teal-50: rgba(20,60,110,0.35);
            --cyan-600: #22d3ee;
            --cyan-500: #38bdf8;
            --ink-900: #eaf6ff;
            --ink-700: rgba(222,238,255,0.88);
            --ink-500: rgba(190,215,245,0.62);
            --ink-300: rgba(170,200,235,0.42);
            --line: rgba(120,190,255,0.16);
            --danger: #ff6b81;
            --warn: #fbbf24;
            --good: #34d399;
            --panel: rgba(13,25,48,0.72);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Prompt', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body { height: 100%; }
        body {
            color: var(--ink-700);
            padding-bottom: 48px;
            background:
                radial-gradient(1100px 500px at 12% -8%, rgba(34,211,238,0.12) 0%, rgba(34,211,238,0) 55%),
                radial-gradient(900px 460px at 105% 8%, rgba(94,234,212,0.10) 0%, rgba(94,234,212,0) 55%),
                #050c1a;
            min-height: 100vh;
        }

        nav {
            background-color: rgba(8,16,32,0.78);
            backdrop-filter: blur(10px);
            padding: 18px 40px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .brand-mark {
            width: 42px; height: 42px; border-radius: 13px; flex-shrink: 0;
            background: linear-gradient(135deg, var(--teal-500), var(--cyan-600));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 14px -4px rgba(13,148,136,0.55);
        }
        .brand-mark svg { width: 24px; height: 24px; }
        nav .brand-text h1 {
            font-size: 21px; font-weight: 700; letter-spacing: -0.2px;
            background: linear-gradient(90deg, var(--ink-900), var(--teal-600));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        nav .brand-text p { color: var(--ink-500); font-size: 12px; margin-top: 2px; font-weight: 400; }
        .badge-chip {
            margin-left: auto;
            display: flex; align-items: center; gap: 6px;
            background: var(--teal-50); border: 1px solid var(--teal-100);
            color: var(--teal-600); font-size: 12px; font-weight: 600;
            padding: 7px 14px; border-radius: 999px;
        }
        .badge-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal-500); box-shadow: 0 0 0 3px rgba(20,184,166,0.25); }

        /* ผังหน้าเดียวแนวตั้งเสมอ: กล่องอัปโหลดอยู่บนสุด แดชบอร์ดผลลัพธ์โผล่ต่อด้านล่างหลังวิเคราะห์เสร็จ
           จำกัดความกว้างให้แคบลง (แบบคอลัมน์เดียวจริงๆ) แทนที่จะยืดเต็มจอกว้างเทอะทะ */
        main { max-width: 520px; margin: 34px auto; padding: 0 24px; display: flex; flex-direction: column; gap: 22px; }
        @media (max-width: 900px) { main { margin: 20px auto; padding: 0 16px; gap: 18px; } nav { padding: 16px 20px; } }
        @media (max-width: 480px) {
            section { padding: 18px !important; }
            h2 { font-size: 14.5px; margin-bottom: 14px; white-space: nowrap; }
            nav { padding: 12px 16px; gap: 10px; }
            nav .brand-text h1 { font-size: 17px; }
            nav .brand-text p { font-size: 10.5px; }
            .badge-chip { display: none; }
        }

        section {
            background-color: var(--panel);
            backdrop-filter: blur(16px);
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 10px 30px -14px rgba(0,0,0,0.5);
            border: 1px solid var(--line);
            display: flex; flex-direction: column; justify-content: space-between;
            scroll-margin-top: 18px; /* กันหัว section โดนบังตอนเลื่อนจอเข้ามาแบบ scrollIntoView */
        }
        @keyframes sectionPulse {
            0% { box-shadow: 0 10px 30px -14px rgba(0,0,0,0.5), 0 0 0 0 rgba(94,234,212,0.45); }
            60% { box-shadow: 0 10px 30px -14px rgba(0,0,0,0.5), 0 0 0 10px rgba(94,234,212,0); }
            100% { box-shadow: 0 10px 30px -14px rgba(0,0,0,0.5), 0 0 0 0 rgba(94,234,212,0); }
        }
        section.section-pulse { animation: sectionPulse 1.1s ease-out 2; }
        h2 {
            font-size: 16px; font-weight: 600; margin-bottom: 18px; color: var(--ink-900);
            display: flex; align-items: center; gap: 8px;
        }
        h2 .icon-chip {
            width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
            background: var(--teal-50); font-size: 15px; flex-shrink: 0;
        }

        .drop-box {
            border: 2px dashed rgba(94,234,212,0.35); border-radius: 16px; padding: 44px 20px; text-align: center;
            background: linear-gradient(180deg, rgba(20,60,110,0.16), rgba(20,60,110,0.05));
            cursor: pointer; transition: all 0.2s;
        }
        .drop-box:hover, .drop-box.drag-over { background-color: var(--teal-50); border-color: var(--teal-500); }
        .drop-box .upload-icon {
            width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 50%;
            background: linear-gradient(135deg, var(--teal-500), var(--cyan-600));
            display: flex; align-items: center; justify-content: center; font-size: 24px;
            box-shadow: 0 8px 18px -6px rgba(13,148,136,0.5);
        }
        .drop-box p.title { font-size: 14px; font-weight: 600; color: var(--ink-700); }
        .drop-box p.hint { font-size: 12px; color: var(--ink-300); margin-top: 4px; }

        img { width: 100%; max-height: 320px; object-fit: contain; border-radius: 14px; border: 1px solid var(--line); background-color: rgba(255,255,255,0.04); }

        button#btn-analyze {
            width: 100%; color: #04141c; border: none; padding: 15px; font-size: 15px; font-weight: 700;
            border-radius: 14px; cursor: pointer; margin-top: 22px; transition: all 0.2s;
            background: linear-gradient(90deg, var(--teal-600), var(--cyan-600));
            box-shadow: 0 10px 24px -8px rgba(34,211,238,0.45);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        button#btn-analyze:hover { transform: translateY(-1px); box-shadow: 0 14px 28px -8px rgba(34,211,238,0.55); }
        button#btn-analyze:disabled { background: rgba(255,255,255,0.08); color: var(--ink-300); cursor: not-allowed; box-shadow: none; transform: none; }

        .disclaimer {
            font-size: 11px; color: var(--ink-300); border-top: 1px solid var(--line);
            padding-top: 14px; margin-top: 26px; line-height: 1.6; display: flex; gap: 8px;
        }

        /* Score gauge */
        .gauge-wrap { display: flex; align-items: center; gap: 22px; padding: 6px 4px 22px; border-bottom: 1px dashed var(--line); margin-bottom: 20px; }
        .gauge { position: relative; width: 116px; height: 116px; flex-shrink: 0; }
        .gauge svg { transform: rotate(-90deg); width: 116px; height: 116px; }
        .gauge circle { fill: none; stroke-width: 11; }
        .gauge .bg { stroke: rgba(255,255,255,0.08); }
        .gauge .fg { stroke: url(#gaugeGradient); stroke-linecap: round; transition: stroke-dashoffset 0.8s cubic-bezier(.4,0,.2,1); }
        .gauge .gauge-label {
            position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .gauge .gauge-label span#txt-score { font-size: 22px; font-weight: 700; color: var(--ink-900); }
        .gauge .gauge-label span.sub { font-size: 10px; color: var(--ink-300); font-weight: 500; margin-top: 1px; }
        .gauge-desc h3 { font-size: 14px; font-weight: 600; color: var(--ink-900); margin-bottom: 4px; }
        .gauge-desc p { font-size: 12.5px; color: var(--ink-500); line-height: 1.5; }
        .gauge-desc .count-pill {
            display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
            background: rgba(255,107,129,0.14); color: var(--danger); border: 1px solid rgba(255,107,129,0.35);
            font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
        }

        /* การ์ดผลวิเคราะห์แบบเลื่อนดูทีละใบ (สไตล์รายงานผิวหน้ามืออาชีพ) */
        .result-carousel-wrap { position: relative; margin-bottom: 4px; }
        .result-cards {
            display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory;
            padding: 4px 2px 10px; scrollbar-width: none;
        }
        .result-cards::-webkit-scrollbar { display: none; }
        .result-card {
            flex: 0 0 198px; scroll-snap-align: start; border-radius: 16px; overflow: hidden;
            border: 1px solid var(--line); background: rgba(13,25,48,0.85);
            box-shadow: 0 10px 22px -16px rgba(0,0,0,0.55);
        }
        .result-card-img-wrap { width: 100%; aspect-ratio: 1 / 1; background: rgba(255,255,255,0.04); overflow: hidden; }
        .result-card-img-wrap img { width: 100%; height: 100%; max-height: none; object-fit: cover; border-radius: 0; border: none; display: block; }
        .result-card-body { padding: 12px 13px 14px; }
        .result-card-title { font-size: 12.5px; font-weight: 700; color: var(--ink-900); margin-bottom: 9px; }
        .result-card-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 11px; }
        .grade-badge { font-size: 10.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
        .grade-great { background: rgba(52,211,153,0.16); color: var(--good); }
        .grade-good  { background: var(--teal-50); color: var(--teal-600); }
        .grade-fair  { background: rgba(251,191,36,0.16); color: var(--warn); }
        .grade-poor  { background: rgba(255,107,129,0.16); color: var(--danger); }

        .mini-ring { position: relative; width: 36px; height: 36px; flex-shrink: 0; }
        .mini-ring svg { width: 36px; height: 36px; transform: rotate(-90deg); }
        .mini-ring circle { fill: none; stroke-width: 4; }
        .mini-ring .mr-bg { stroke: rgba(255,255,255,0.08); }
        .mini-ring .mr-fg { stroke: var(--teal-600); stroke-linecap: round; transition: stroke-dashoffset 0.6s ease; }
        .mini-ring-txt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 700; color: var(--ink-900); }

        .result-card-btn {
            width: 100%; border: none; color: #ffffff; font-size: 12px; font-weight: 600;
            padding: 9px; border-radius: 10px; cursor: pointer; background: var(--good); transition: filter 0.15s;
        }
        .result-card-btn:hover { filter: brightness(1.07); }
        .result-card-detail { font-size: 11.5px; color: var(--ink-500); line-height: 1.6; margin-top: 10px; }

        .carousel-nav {
            position: absolute; top: 38%; transform: translateY(-50%); z-index: 2;
            width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); cursor: pointer;
            background: rgba(8,16,32,0.7); color: #eaf6ff; font-size: 15px; display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(3px); transition: background 0.15s;
        }
        .carousel-nav:hover { background: rgba(8,16,32,0.9); }
        .carousel-nav.prev { left: -6px; }
        .carousel-nav.next { right: -6px; }

        .advice {
            padding: 16px 18px; border-radius: 14px; font-size: 13.5px; border: 1px solid var(--line); margin-top: 18px;
            display: flex; gap: 12px; align-items: flex-start;
        }
        .advice .advice-icon { font-size: 20px; line-height: 1; }
        .hidden { display: none !important; }

        /* กล่องคำแนะนำที่สร้างโดย Gemini AI ตามผลวิเคราะห์จริง */
        .ai-advice-box {
            margin-top: 14px; padding: 16px 18px; border-radius: 14px;
            border: 1px solid var(--teal-100); background: linear-gradient(165deg, rgba(20,60,110,0.35), rgba(10,20,40,0.55) 60%);
        }
        .ai-advice-head { margin-bottom: 9px; }
        .ai-badge {
            font-size: 11px; font-weight: 700; color: var(--teal-600); background: rgba(255,255,255,0.06);
            border: 1px solid var(--teal-100); padding: 4px 11px; border-radius: 999px;
        }
        .ai-advice-text { font-size: 13px; color: var(--ink-700); line-height: 1.7; white-space: pre-wrap; }
        .ai-advice-text.loading { color: var(--ink-300); font-style: italic; }

        /* กล่องรับภาพรวมช่อง: แสดงพรีวิวรูปที่เลือก/ถ่าย พร้อมเอฟเฟกต์กำลังสแกนตอนวิเคราะห์
           ผู้ใช้อยากเห็นรูปเต็มภาพ (ไม่ครอปทิ้ง) ยอมให้มีช่องว่างซ้าย-ขวาแทน จึงใช้ object-fit:contain
           + ทำกล่องให้เตี้ยลง/กว้างกว่าความสูง (280px) เพื่อให้รูปภาพแนวตั้งทั่วไปพอดีเต็มความสูงพอดี
           ช่องว่าง (ถ้ามี) จะไปอยู่ซ้าย-ขวาเป็นหลัก ไม่ใช่บน-ล่าง และให้เห็นเป็นสีเข้มของกรอบ ไม่ใช่สีขาว */
        .preview-frame {
            position: relative; width: 100%; height: 280px; border-radius: 16px; overflow: hidden;
            background: #0b1211; border: 1px solid var(--line);
        }
        .preview-frame img {
            display: block; width: 100%; height: 100%; background-color: transparent;
            object-fit: contain; border-radius: 0; border: none;
        }
        .change-photo-btn {
            position: absolute; top: 10px; right: 10px; border: none; cursor: pointer;
            background: rgba(15,32,39,0.55); color: #fff; font-size: 11.5px; font-weight: 600;
            padding: 7px 13px; border-radius: 999px; backdrop-filter: blur(4px); transition: background 0.15s;
        }
        .change-photo-btn:hover { background: rgba(15,32,39,0.75); }

        .scan-overlay {
            position: absolute; inset: 0; overflow: hidden;
            background: rgba(6,20,18,0.22);
            display: flex; align-items: flex-end; justify-content: center; padding-bottom: 16px;
        }
        .scan-overlay::before {
            content: ""; position: absolute; inset: 0;
            background-image: repeating-linear-gradient(0deg, rgba(94,234,212,0.10) 0px, rgba(94,234,212,0.10) 1px, transparent 1px, transparent 26px);
        }
        .scan-overlay .scan-line {
            position: absolute; left: 0; right: 0; top: 0; height: 3px;
            background: linear-gradient(90deg, transparent, #5eead4, #22d3ee, #5eead4, transparent);
            box-shadow: 0 0 18px 5px rgba(45,212,191,0.7);
            animation: scanMove 2.1s ease-in-out infinite;
        }
        @keyframes scanMove {
            0% { top: 2%; }
            50% { top: 96%; }
            100% { top: 2%; }
        }
        .scan-overlay .scan-text {
            position: relative; z-index: 2; background: rgba(15,32,39,0.55); color: #fff;
            font-size: 12.5px; font-weight: 600; padding: 7px 15px; border-radius: 999px; backdrop-filter: blur(4px);
        }

        #result-dashboard.fade-in { animation: fadeInUp 0.45s ease both; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* สลับโหมดอัปโหลด / กล้อง */
